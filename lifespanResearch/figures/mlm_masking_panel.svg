<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040">
  <defs>
    <marker id="arrow-dark" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#171717"/>
    </marker>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#1f7a4d"/>
    </marker>
    <marker id="arrow-red" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#ef6f6c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 20px; fill: #3f4a43; }
      .label { font-size: 22px; fill: #1f2a23; }
      .small { font-size: 17px; fill: #47544b; }
      .tiny { font-size: 15px; fill: #3c453f; }
      .stroke { stroke: #171717; stroke-width: 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="1040" fill="#ffffff"/>
  <rect x="54" y="52" width="792" height="928" rx="34" fill="#eafbea"/>
  <rect x="54" y="52" width="792" height="928" rx="34" fill="none" stroke="#ccebcf" stroke-width="5"/>

  <text class="font title" x="450" y="113" text-anchor="middle">Masked Language Modeling</text>
  <text class="font subtitle" x="450" y="146" text-anchor="middle">15% of amino-acid residues are selected for reconstruction</text>

  <!-- Input sequence -->
  <g filter="url(#shadow)">
    <rect x="174" y="202" width="552" height="78" rx="22" fill="#fbfff9" class="stroke"/>
  </g>
  <text class="font small" x="180" y="186">corrupted protein sequence</text>
  <g class="font label" text-anchor="middle">
    <rect x="210" y="220" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="236" y="250">M</text>
    <rect x="285" y="220" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="311" y="250">V</text>
    <rect x="360" y="220" width="94" height="42" fill="#ffd9df" stroke="#111111" stroke-width="3"/>
    <text x="407" y="249" font-size="19">&lt;mask&gt;</text>
    <rect x="477" y="220" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="503" y="250">A</text>
    <rect x="552" y="220" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="578" y="250">E</text>
    <rect x="627" y="220" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="653" y="250">G</text>
  </g>
  <path d="M407 281 L407 328" fill="none" stroke="#1f7a4d" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text class="font tiny" x="614" y="322">masked target</text>

  <!-- Encoder stack -->
  <g>
    <rect x="242" y="330" width="470" height="372" rx="26" fill="#d3ecdd" stroke="#111111" stroke-width="4"/>
    <rect x="208" y="362" width="470" height="372" rx="26" fill="#c8e5d4" stroke="#111111" stroke-width="4"/>
    <rect x="174" y="394" width="470" height="372" rx="26" fill="#bee0cc" stroke="#111111" stroke-width="4"/>
    <text class="font small" x="586" y="430" text-anchor="middle">x N</text>

    <rect x="286" y="448" width="268" height="68" rx="7" fill="#ffb0a8" stroke="#111111" stroke-width="4"/>
    <text class="font label" x="420" y="490" text-anchor="middle">Self-attention</text>
    <path d="M420 518 L420 557" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow-dark)"/>

    <rect x="286" y="560" width="268" height="58" rx="7" fill="#d8b6f0" stroke="#111111" stroke-width="4"/>
    <text class="font label" x="420" y="597" text-anchor="middle">Add &amp; Norm</text>
    <path d="M420 620 L420 660" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow-dark)"/>

    <rect x="286" y="663" width="268" height="68" rx="7" fill="#ffc9aa" stroke="#111111" stroke-width="4"/>
    <text class="font label" x="420" y="705" text-anchor="middle">Feed Forward</text>

    <path d="M238 485 L238 696 L280 696" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow-dark)"/>
    <path d="M238 590 L280 590" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow-dark)"/>
  </g>

  <path d="M420 768 L420 816" fill="none" stroke="#1f7a4d" stroke-width="5" marker-end="url(#arrow-green)"/>

  <!-- Prediction -->
  <text class="font small" x="180" y="826">reconstructed residues</text>
  <g filter="url(#shadow)">
    <rect x="174" y="842" width="552" height="78" rx="22" fill="#fbfff9" class="stroke"/>
  </g>
  <g class="font label" text-anchor="middle">
    <rect x="210" y="860" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="236" y="890">M</text>
    <rect x="285" y="860" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="311" y="890">V</text>
    <rect x="360" y="860" width="52" height="42" fill="#ddffed" stroke="#111111" stroke-width="3"/>
    <text x="386" y="890">T</text>
    <rect x="477" y="860" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="503" y="890">A</text>
    <rect x="552" y="860" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="578" y="890">E</text>
    <rect x="627" y="860" width="52" height="42" fill="#f4fff0" stroke="#111111" stroke-width="3"/>
    <text x="653" y="890">G</text>
  </g>

  <path d="M407 263 C650 330 732 540 642 720 C592 820 480 845 400 858"
        fill="none" stroke="#ef6f6c" stroke-width="3.5" stroke-dasharray="8 8"
        stroke-linecap="round" marker-end="url(#arrow-red)"/>

  <rect x="270" y="936" width="360" height="44" rx="13" fill="#fff4ee" stroke="#ef8a4c" stroke-width="3"/>
  <text class="font small" x="450" y="964" text-anchor="middle">MLM loss on masked positions</text>
</svg>
